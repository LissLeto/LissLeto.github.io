<div class="masthead{% if page.author_profile or layout.author_profile or page.sidebar %} masthead--mobile-only{% endif %}">
  <div class="masthead__inner-wrap">
    <a class="masthead__home" href="{{ "/" | relative_url }}">Homepage</a>
    <div class="masthead__menu">
      <details class="mobile-site-menu" id="mobile-site-menu">
        <summary>
          <span>Menu</span>
          <i class="fas fa-bars menu-icon-open" aria-hidden="true"></i>
          <i class="fas fa-times menu-icon-close" aria-hidden="true"></i>
        </summary>
        <nav class="site-navigation mobile-site-menu__links" aria-label="Main navigation">
          {% include navigation-links.html %}
        </nav>
      </details>
    </div>
  </div>
</div>
