<ul>
  <li>
    <a href="{{ "/" | relative_url }}"{% if page.url == "/" %} aria-current="page"{% endif %}>
      <span class="nav-label">Homepage</span>
      <span class="nav-label-italic" aria-hidden="true">Homepage</span>
    </a>
  </li>
  {% for link in site.data.navigation.main %}
    <li>
      <a href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>
        <span class="nav-label">{{ link.title | escape }}</span>
        <span class="nav-label-italic" aria-hidden="true">{{ link.title | escape }}</span>
      </a>
    </li>
  {% endfor %}
</ul>
